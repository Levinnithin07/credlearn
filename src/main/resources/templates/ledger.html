<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${pageTitle})}"></head><body th:classappend="${me.compactView} ? compact"><a class="skip-link" href="#main">Skip to content</a><div class="app-shell"><aside th:replace="~{fragments :: sidebar}"></aside><div class="app-main"><header th:replace="~{fragments :: topbar}"></header><main id="main" class="content"><div th:replace="~{fragments :: flash}"></div>
<div th:replace="~{fragments :: pageHeading('A permanent record of the time you share and the skills you discover.')}"></div><form th:action="@{/ledger}" method="get" class="filter-form"><label for="filter">Transactions</label><select id="filter" name="filter" class="form-select"><option value="all" th:selected="${filter=='all'}">All activity</option><option value="earned" th:selected="${filter=='earned'}">Teaching earnings</option><option value="spent" th:selected="${filter=='spent'}">Learning spending</option><option value="starter" th:selected="${filter=='starter'}">Starter credits</option></select><button class="btn btn-outline-primary">Apply filter</button></form><div class="panel table-panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th scope="col">Transaction</th><th scope="col">Exchange</th><th scope="col">From → To</th><th scope="col">Date (IST)</th><th scope="col">Credits</th><th scope="col">Status</th></tr></thead><tbody><tr th:each="t : ${transactions}"><td th:text="'#'+${t.id}"></td><td><a th:if="${t.session!=null}" th:href="@{/sessions/{id}(id=${t.session.id})}" th:text="${t.session.skill.title}"></a><span th:if="${t.session==null}">Starter credits</span><small class="d-block" th:if="${t.session!=null}" th:text="'Session #'+${t.session.id}"></small></td><td th:text="${(t.sender==null ? 'CredLearn' : t.sender.fullName)+' → '+t.receiver.fullName}"></td><td th:text="${@display.time(t.createdAt)}"></td><td class="credit-amount" th:classappend="${t.receiver.id==me.id} ? positive" th:text="${(t.receiver.id==me.id ? '+' : '−')+t.amount}"></td><td><span class="status completed">Recorded</span></td></tr><tr th:if="${#lists.isEmpty(transactions)}"><td colspan="6" class="text-center py-5">No transactions match this filter.</td></tr></tbody></table></div></div><nav class="pagination-nav" aria-label="Ledger pages"><a th:if="${index>0}" th:href="@{/ledger(filter=${filter},page=${index-1})}">← Previous</a><span th:text="'Page '+${index+1}+' of '+${pages}"></span><a th:if="${index+1<pages}" th:href="@{/ledger(filter=${filter},page=${index+1})}">Next →</a></nav>
</main><footer class="app-footer">Teach Skills. Earn Credits. Keep Learning. <span>All session times are in India Standard Time (IST).</span></footer></div></div></body></html>
