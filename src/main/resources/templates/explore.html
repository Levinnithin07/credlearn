<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${pageTitle})}"></head><body th:classappend="${me.compactView} ? compact"><a class="skip-link" href="#main">Skip to content</a><div class="app-shell"><aside th:replace="~{fragments :: sidebar}"></aside><div class="app-main"><header th:replace="~{fragments :: topbar}"></header><main id="main" class="content"><div th:replace="~{fragments :: flash}"></div>
<div th:replace="~{fragments :: pageHeading('A campus full of knowledge. Find someone to learn from.')}"></div>
<form class="search-panel" th:action="@{/explore}" method="get"><div class="search-input"><label class="visually-hidden" for="q">Search skills</label><span aria-hidden="true">⌕</span><input class="form-control" id="q" name="q" th:value="${q}" maxlength="100" placeholder="What would you like to learn?"></div><label class="visually-hidden" for="category">Category</label><select id="category" name="category" class="form-select"><option value="">All categories</option><option th:each="c : ${categories}" th:value="${c}" th:selected="${c==category}" th:text="${c.label}"></option></select><button class="btn btn-primary">Find a skill</button></form>
<div class="results-line"><span><strong th:text="${results.totalElements}"></strong> skills to spark your curiosity</span><span>1 hour = 1 credit</span></div><div class="skill-grid"><th:block th:each="skill : ${results.content}"><article th:replace="~{fragments :: skillCard(${skill})}"></article></th:block></div>
<div class="empty-state panel" th:if="${results.empty}"><span aria-hidden="true">⌕</span><h3>No matches just yet</h3><p>Try another search or be the first to share a skill.</p><a th:href="@{/explore}">Clear filters →</a></div><nav class="pagination-nav" aria-label="Marketplace pages"><a th:if="${results.hasPrevious()}" th:href="@{/explore(q=${q},category=${category},page=${results.number-1})}">← Previous</a><span th:text="'Page '+${results.number+1}+' of '+${T(java.lang.Math).max(1,results.totalPages)}"></span><a th:if="${results.hasNext()}" th:href="@{/explore(q=${q},category=${category},page=${results.number+1})}">Next →</a></nav>
</main><footer class="app-footer">Teach Skills. Earn Credits. Keep Learning. <span>All session times are in India Standard Time (IST).</span></footer></div></div></body></html>
