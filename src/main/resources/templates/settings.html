<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${pageTitle})}"></head><body th:classappend="${me.compactView} ? compact"><a class="skip-link" href="#main">Skip to content</a><div class="app-shell"><aside th:replace="~{fragments :: sidebar}"></aside><div class="app-main"><header th:replace="~{fragments :: topbar}"></header><main id="main" class="content"><div th:replace="~{fragments :: flash}"></div>
<div th:replace="~{fragments :: pageHeading('A few small settings for your account and your workspace.')}"></div><div class="form-layout"><form th:action="@{/settings/password}" th:object="${form}" method="post" class="panel form-panel"><div th:replace="~{fragments :: errors}"></div><h2>Change your password</h2><p>You'll sign in again after updating it.</p><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" class="form-control" required autocomplete="current-password"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" class="form-control" required minlength="10" maxlength="72" autocomplete="new-password"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" class="form-control" required autocomplete="new-password"><button class="btn btn-primary mt-4">Update password</button></form><div><section class="panel"><h2>Your workspace</h2><form th:action="@{/settings/preferences}" method="post"><label class="check-label"><input type="checkbox" name="compact" value="true" th:checked="${me.compactView}"> Use compact spacing</label><p class="text-muted">Fit a little more into your dashboard.</p><button class="btn btn-outline-primary">Save preference</button></form></section><section class="panel mt-4"><h2>Your account</h2><p th:text="${me.email}"></p><a th:href="@{/profile}">Edit profile ↗</a><hr><form th:action="@{/logout}" method="post"><button class="btn btn-outline-primary">Log out</button></form></section></div></div>
</main><footer class="app-footer">Teach Skills. Earn Credits. Keep Learning. <span>All session times are in India Standard Time (IST).</span></footer></div></div></body></html>
