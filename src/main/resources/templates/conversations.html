<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${pageTitle})}"></head><body><div class="app-shell"><aside th:replace="~{fragments :: sidebar}"></aside><div class="app-main"><header th:replace="~{fragments :: topbar}"></header><main id="main" class="content"><div th:replace="~{fragments :: pageHeading('A private space for each accepted learning session.')}"></div><section class="panel"><div class="empty-state" th:if="${#lists.isEmpty(threads)}"><h2>Your next conversation starts with a skill</h2><p>Once a teacher accepts your request, your private conversation appears here.</p><a class="btn btn-primary" th:href="@{/explore}">Explore skills ↗</a></div><a class="conversation-row" th:each="thread : ${threads}" th:href="@{/sessions/{id}/chat(id=${thread.sessionId})}"><span class="avatar" th:text="${@display.initials(thread.peer)}"></span><div><h2 th:text="${thread.peer}"></h2><p th:text="${thread.skill}"></p><small th:text="${thread.status}+(thread.writable?' · Open conversation':' · Read-only history')"></small></div><span class="unread-badge" th:if="${thread.unread>0}" th:text="${thread.unread}+' unread'"></span><span aria-hidden="true">↗</span></a></section></main><footer class="app-footer">Teach Skills. Earn Credits. Keep Learning.</footer></div></div></body></html>
