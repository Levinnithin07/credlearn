<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${pageTitle})}"></head><body th:classappend="${me.compactView} ? compact"><a class="skip-link" href="#main">Skip to content</a><div class="app-shell"><aside th:replace="~{fragments :: sidebar}"></aside><div class="app-main"><header th:replace="~{fragments :: topbar}"></header><main id="main" class="content"><div th:replace="~{fragments :: flash}"></div>
<div th:replace="~{fragments :: pageHeading('Your requests, shared time, and next steps — all in one place.')}"></div><form th:action="@{/sessions}" method="get" class="filter-form"><label for="status">Show sessions</label><select id="status" name="status" class="form-select"><option value="ALL">All sessions</option><option th:each="s : ${statuses}" th:value="${s}" th:selected="${s.name()==status}" th:text="${#strings.capitalize(#strings.toLowerCase(s))}"></option></select><button class="btn btn-outline-primary">Apply filter</button></form><div class="session-list"><a th:each="s : ${sessions}" class="session-row panel" th:href="@{/sessions/{id}(id=${s.id})}"><span class="skill-symbol">◷</span><div class="session-row-info"><span class="eyebrow" th:text="${s.requester.id==me.id ? 'LEARNING' : 'TEACHING'}"></span><h2 th:text="${s.skill.title}"></h2><p th:text="${s.requester.id==me.id ? 'With '+s.provider.fullName : 'With '+s.requester.fullName}"></p></div><div class="session-row-date"><strong th:text="${@display.time(s.startsAt)}"></strong><small th:text="${s.durationMinutes}+' minutes · '+${s.credits}+' credits'"></small></div><span class="status" th:classappend="${#strings.toLowerCase(s.status)}" th:text="${s.status}"></span><span>↗</span></a></div><div class="empty-state panel" th:if="${#lists.isEmpty(sessions)}"><span aria-hidden="true">▦</span><h3>A little space for possibility</h3><p>No sessions match this view yet.</p><a th:href="@{/explore}">Explore a new skill →</a></div>
</main><footer class="app-footer">Teach Skills. Earn Credits. Keep Learning. <span>All session times are in India Standard Time (IST).</span></footer></div></div></body></html>
